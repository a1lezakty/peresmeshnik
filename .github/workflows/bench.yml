name: bench

# Manual only: Actions → bench → Run workflow, or add a label to a PR: "bench" runs every suite,
# "bench-<suite>" (e.g. bench-clone) one suite. workflow_dispatch needs this file on the default
# branch; the label also works before the merge.
on:
  workflow_dispatch:
    inputs:
      suites:
        description: 'JSON list of suites: asr, mt, tts, clone, latency'
        default: '["asr", "mt", "tts", "clone"]'
      os:
        description: 'Runner'
        default: macos-15
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.label.name, 'bench')
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.s.outputs.suites }}
    steps:
      - id: s
        env:
          INPUT: ${{ github.event.inputs.suites }}
          LABEL: ${{ github.event.label.name }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json, os
          allowed = ['asr', 'mt', 'tts', 'clone', 'latency']
          inp, label = os.environ['INPUT'], os.environ['LABEL']
          suites = json.loads(inp) if inp else allowed[:4] if label == 'bench' else [label.removeprefix('bench-')]
          if not isinstance(suites, list) or not suites or any(s not in allowed for s in suites):
              raise SystemExit(f'unknown suite in {suites!r}; allowed: {allowed}')
          print('suites=' + json.dumps(suites))
          EOF

  bench:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    runs-on: ${{ github.event.inputs.os || 'macos-15' }}
    timeout-minutes: 150
    env:
      BENCH_DATA: ${{ github.workspace }}/bench-data
      BENCH_HOST: ${{ github.event.inputs.os || 'macos-15' }}
      HF_HOME: ${{ github.workspace }}/models/hf
      TORCH_HOME: ${{ github.workspace }}/models/torch
      PERESMESHNIK_MODELS: ${{ github.workspace }}/models
      COQUI_TOS_AGREED: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          version: '0.13.7'  # uv itself pinned, not the latest; setup-uv v6.8.0 knows no checksum past 0.8.20, so ours:
          # the SHA-256 of the release's uv-<target> archive (its .sha256 file) for Windows and Linux x64, macOS arm64 and
          # x64; another runner gets a sum that fails
          checksum: ${{ runner.os == 'Windows' && '0cdc5b38fe5a8168ed6a25814f5ba43c21d313dd3187314fccb37b7cec46e021'
            || runner.os == 'Linux' && 'c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83'
            || runner.arch == 'ARM64' && '81b811b57e4624df7ed3aac148e0359100d9962f3d9dce00aec533dc2e086731'
            || '20c47e4c1f630b8abaff8c291fa9b9aa300fef92c4fbff95adf198b55287cda7' }}
          python-version: '3.12'
      - name: Machine
        run: |
          uname -a; sysctl -n machdep.cpu.brand_string hw.memsize hw.ncpu 2>/dev/null || nproc; df -h .
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: bench-data
          key: bench-data-${{ hashFiles('bench/data.py') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: models
          # this file in the key: the GGUF revisions and sums live below, so a new one makes a new key, restore-keys
          # brings the old cache, the step fetches the changed file once and the new key saves it (a key without it hits
          # the old cache every run, never saves, and the step fetches ~5.8 GB each time)
          key: models-${{ matrix.suite }}-${{ runner.os }}-${{ hashFiles('bench/*.py', 'bench/requirements*.txt', '.github/workflows/bench.yml') }}
          restore-keys: models-${{ matrix.suite }}-${{ runner.os }}-
      - name: Bench venv
        if: matrix.suite != 'clone'
        run: |
          uv venv .bench
          if [ "$RUNNER_OS" = Linux ]; then CPU="--extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match"; fi
          uv pip install -p .bench -r bench/requirements.txt ${CPU:-}
          .bench/bin/python bench/data.py
          .bench/bin/python -c "import torch, onnxruntime as o; print('mps', torch.backends.mps.is_available(), 'ort', o.get_available_providers())"
      - name: llama.cpp + HY-MT1.5 GGUF
        if: matrix.suite == 'mt' && runner.os == 'macOS'
        run: |
          # the archive is run here and the weights make BENCH's numbers: each checked by SHA-256, at a fixed commit
          curl -sL -o llama.tgz https://github.com/ggml-org/llama.cpp/releases/download/b12189/llama-b12189-bin-macos-arm64.tar.gz
          echo 'f30e2f3032df30a0c37c9fbd43125253dcd4cb96d6a879aa81e464944bc20aee  llama.tgz' | shasum -a 256 -c
          tar xzf llama.tgz
          echo "LLAMA_SERVER=$(find $PWD -name llama-server -type f | head -1)" >> $GITHUB_ENV
          mkdir -p models/gguf
          for m in 1.8B:265b2e615a7dc9b06c435dc878829ad99a512ba2:4383ac0c3c8e476de98ff979c2a3f069f8c4fb385e7860cf2d28da896cc477c7 \
                   7B:126325496bc8e3575f1d8615b8ca951d8483f206:fc87637e4dd29547811a28170770c2ac17725fb7690b7c4aafa4f463c3e77568; do
            IFS=: read -r size rev sum <<< "$m"
            f=models/gguf/HY-MT1.5-$size-Q4_K_M.gguf
            url=https://huggingface.co/tencent/HY-MT1.5-$size-GGUF/resolve/$rev/HY-MT1.5-$size-Q4_K_M.gguf
            [ -f $f ] || curl -sfL -o $f $url
            # a cache of an older revision (restore-keys) has another file: fetched once again, else it fails for good
            echo "$sum  $f" | shasum -a 256 -c || { rm -f $f; curl -sfL -o $f $url; echo "$sum  $f" | shasum -a 256 -c; }
          done
          echo "GGUF=$PWD/models/gguf/HY-MT1.5-1.8B-Q4_K_M.gguf $PWD/models/gguf/HY-MT1.5-7B-Q4_K_M.gguf" >> $GITHUB_ENV
      - name: Run ${{ matrix.suite }}
        if: matrix.suite != 'clone' && matrix.suite != 'latency'
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          if [ "$RUNNER_OS" = macOS ] && [ "$SUITE" = mt ]; then export LLAMA_DEVICE=metal; fi
          PY=$PWD/.bench/bin/python bench/suite.sh "$SUITE" --threads 3
      - name: Voice clone
        if: matrix.suite == 'clone'
        run: bench/clone_ci.sh
      - name: Latency, this checkout against 0.3.1 (35aff6d)
        if: matrix.suite == 'latency'
        run: |
          # LATENCY 0.3.2: me -> them (Pocket clone; English: bench/pocket_speed.py's stand-in, ungated weights only) and
          # them -> me (Pocket-ru, their voice), each run by its own checkout's scripts; on Linux also the quality of
          # the clause ends on conversation (bench/conversation.py segment, AMI + YODAS2: fed as fast as it goes)
          PY=$PWD/.bench/bin/python O=bench/results/latency V=$RUNNER_TEMP/voices EN=$RUNNER_TEMP/pocket-en-standin
          B=$RUNNER_TEMP/before
          mkdir -p $O; failed=0
          run() { echo "== $*"; "$@" || { echo "FAILED: $*"; failed=$((failed + 1)); }; }
          uv pip install -q -p .bench -e .
          $PY -m peresmeshnik models fetch --accept-licenses silero-vad wespeaker-resnet34 parakeet-tdt-0.6b-v3 \
            gigaam-v3-e2e-ctc gigaam-v3-e2e-rnnt quickmt-en-ru opus-mt-ru-en piper-ru_RU-dmitri-medium piper-en_US-john-medium \
            pocket-tts-ru  # ru ASR: 0.3.1's CTC, RNN-T since 0.3.2
          git fetch -q --depth 1 origin 35aff6d9d59006e40325f6e51c2e9ec6a10d2197
          git worktree add -q --detach $B 35aff6d9d59006e40325f6e51c2e9ec6a10d2197
          cp bench/their_voice.py $B/bench/  # its subtitle lag too; the rest of the script is 0.3.1's
          PYTHONPATH=$B $PY -c 'import peresmeshnik; print("before:", peresmeshnik.__file__, peresmeshnik.__version__)'
          $PY bench/pocket_speed.py profiles $V
          run $PY bench/pocket_speed.py standin $EN
          run $PY bench/me_them.py input
          ME="--null-mic --voice $V/ref_ru --engine pocket-tts-en --model-dir $EN"
          for i in 1 2 3; do
            BENCH_HOST=$BENCH_HOST-before PYTHONPATH=$B run $PY $B/bench/me_them.py run $ME --out-dir $O/me_before$i
            BENCH_HOST=$BENCH_HOST-after run $PY bench/me_them.py run $ME --out-dir $O/me_after$i
          done
          [ -d bench-data/LibriSpeech/dev-clean/1462 ] || curl -sfL --retry 3 --max-time 900 \
            https://www.openslr.org/resources/12/dev-clean.tar.gz \
            | tar -xzf - -C bench-data LibriSpeech/dev-clean/1272 LibriSpeech/dev-clean/1462 || echo 'FAILED: dev-clean'
          THEM="--data bench-data/LibriSpeech/dev-clean --a 1272 --b 1462 --clone models/pocket-tts-ru --speaker models/wespeaker-resnet34"
          for i in 1 2; do
            BENCH_HOST=$BENCH_HOST-before PYTHONPATH=$B run $PY $B/bench/their_voice.py $THEM --out $O/them_before$i
            BENCH_HOST=$BENCH_HOST-after run $PY bench/their_voice.py $THEM --out $O/them_after$i
          done
          if [ "$RUNNER_OS" = Linux ]; then
            S=$RUNNER_TEMP/conv-src; mkdir -p $S
            AMI=https://groups.inf.ed.ac.uk/ami
            YO=https://huggingface.co/datasets/espnet/yodas2/resolve/main/data/ru000
            get() { [ -s "$S/$1" ] || run curl -sfL --retry 3 --max-time 1200 -o "$S/$1" "$2"; }
            get ami_public_manual_1.6.2.zip $AMI/AMICorpusAnnotations/ami_public_manual_1.6.2.zip
            for m in ES2002a IS1009a; do get $m.Mix-Headset.wav $AMI/AMICorpusMirror/amicorpus/$m/audio/$m.Mix-Headset.wav; done
            get yodas2-ru000-text-00000000.json $YO/text/00000000.json
            get yodas2-ru000-duration-00000000.txt $YO/duration/00000000.txt
            get yodas2-ru000-audio-00000000.tar.gz $YO/audio/00000000.tar.gz
            run $PY bench/conversation.py prep --src $S
            for lang in en ru; do  # 0.3.1's clause end, then subtitles' and them -> me's now (pipeline.QUICK_END)
              BENCH_HOST=$BENCH_HOST-end300 run $PY bench/conversation.py segment $lang --silence 300 --tail 0.8
              BENCH_HOST=$BENCH_HOST-end200 run $PY bench/conversation.py segment $lang --silence 200 --tail 0.5
            done
          fi
          cp $B/bench/results/*.jsonl $O/ 2>/dev/null || true  # 0.3.1's scripts write their rows next to themselves
          find $O -name '*.wav' -exec rm -f {} +  # the artifact: numbers, not audio
          [ $failed = 0 ]
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: bench-${{ matrix.suite }}-${{ github.event.inputs.os || 'macos-15' }}
          path: bench/results/
          if-no-files-found: warn

name: bench

# research-1116-r4 only (round 6), manual: dispatched with ref research-1116-r4.
# ZONOS3-Mini (commit 96d9e0ec) on the macOS runner's CPU (virtual M1, 3 cores, no usable GPU): the backbone with
# --cpu and the audio decoder with --zac-cpu (the server puts it on Metal by default on Apple Silicon).
# BENCH tts_clone method (bench/clone_light.py), BENCH voices; en->ru with the voice vector moved toward Russian speakers.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zonos-mac:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      BENCH_DATA: ${{ github.workspace }}/bench-data
      BENCH_OUT: ${{ github.workspace }}/out
      HF_HOME: ${{ github.workspace }}/hf
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      N: '6'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          version: '0.13.7'
          checksum: '81b811b57e4624df7ed3aac148e0359100d9962f3d9dce00aec533dc2e086731'
          python-version: '3.11'
      - name: Machine
        run: sysctl -n machdep.cpu.brand_string hw.memsize hw.ncpu; df -h .; command -v ffmpeg cargo cmake || true
      - name: Data and venvs
        run: |
          command -v ffmpeg > /dev/null || brew install -q ffmpeg > /dev/null
          uv run -q --no-project -p 3.11 --with numpy --with soundfile --with pyarrow python bench/data.py
          uv venv -q -p 3.11 venv-eval && uv pip install -q -p venv-eval/bin/python -r bench/requirements-tts-clone-eval.txt
          uv venv -q -p 3.11 venv-run && uv pip install -q -p venv-run/bin/python numpy soundfile scipy huggingface_hub psutil
      - name: Build ZONOS3-Mini ggml server
        run: |
          git clone -q https://github.com/Zyphra/ZONOS3-Mini z && git -C z checkout -q 96d9e0ec
          git -C z submodule update -q --init --recursive
          cd z/servers/ggml && cmake -B build -DCMAKE_BUILD_TYPE=Release > ../../../build.log 2>&1 && cmake --build build -j3 >> ../../../build.log 2>&1 \
            || { tail -40 ../../../build.log; exit 1; }
          grep -i "metal\|openmp\|accelerate" ../../../build.log | head -8
      - name: Weights
        run: |
          venv-run/bin/python -c "
          from huggingface_hub import hf_hub_download as h
          for f in ('backbone-ptq.gguf', 'zac-keep2.gguf', 'spk-encoder.gguf'):
              h('Zyphra/ZONOS3-Mini', 'gguf/' + f, local_dir='z/servers/ggml')"
      - name: Run
        run: |
          export ZONOS_BIN=$PWD/z/servers/ggml/build ZONOS_GGUF=$PWD/z/servers/ggml/gguf ZONOS_ARGS=--zac-cpu
          BENCH_THREADS=3 venv-eval/bin/python bench/clone_light.py refs
          venv-run/bin/python r4/zonos_dir.py ru_dir.npy
          run() {  # label threads args...
            local L=$1 T=$2; shift 2
            echo "== $L"
            if BENCH_THREADS=$T OMP_NUM_THREADS=$T venv-run/bin/python bench/clone_light.py synth --model zonos --label "$L" --n "$N" "$@" > "$L.log" 2>&1; then
              BENCH_THREADS=3 venv-eval/bin/python bench/clone_light.py eval --label "$L" 2>&1 | grep -E '^\{' || echo "eval failed: $L"
            else
              tail -25 "$L.log"; echo "synth failed: $L"
            fi
          }
          run mac-zonos-3t 3 --ref-s 5 --cases ru2en
          run mac-zonos-2t 2 --ref-s 5 --cases ru2en
          export ZONOS_SHIFT=$PWD/ru_dir.npy:0.75
          run mac-zonos-3t-d0.75 3 --ref-s 5 --cases en2ru
          for f in out/tts_clone/*/server.log; do echo "--- $f"; grep -i "backend\|zac:\|threads" "$f" | head -8; done

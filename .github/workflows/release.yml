name: release

# A tag v* builds the macOS .dmg, checks it and makes a DRAFT GitHub release with the file and its SHA-256
# (published by hand after a live check). workflow_dispatch and pull requests run the same build and checks
# without a release: the .dmg is a workflow artifact.
on:
  push:
    tags: ['v*']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # a newer push waits: a half-built .dmg tells nothing

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n "s/^__version__ = '\(.*\)'/\1/p" peresmeshnik/__init__.py)
          p=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          test "v$v" = "$GITHUB_REF_NAME" && test "$p" = "$v" || { echo "tag $GITHUB_REF_NAME, __init__ $v, pyproject $p"; exit 1; }
      - run: uv sync --locked --group dev --group build
      - name: Build Peresmeshnik.app and the .dmg (PyInstaller, Swift tap helper, ad-hoc signature)
        env:
          REQUIRE_TAP: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '' }}  # a release needs the call's sound
        run: packaging/macos/build.sh
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/models
          key: models-${{ runner.os }}-${{ hashFiles('peresmeshnik/models.toml') }}
      - name: Models for the frozen CLI check (the same as the work gate)
        env:
          PERESMESHNIK_MODELS: ${{ runner.temp }}/models
        run: uv run --no-sync peresmeshnik models fetch silero-vad parakeet-tdt-0.6b-v3 opus-mt-en-ru piper-ru_RU-dmitri-medium
      - name: Check the .dmg (mount, start, menu-bar item, idle CPU, SIGTERM, frozen CLI)
        shell: bash  # -eo pipefail
        env:
          PERESMESHNIK_MODELS: ${{ runner.temp }}/models
          PERESMESHNIK_REQUIRE_SYNTHETIC: '1'
        run: |
          dmg=$(ls dist/*.dmg) && test -n "$dmg"
          export PERESMESHNIK_DMG=$dmg SCREENSHOTS=$RUNNER_TEMP/screens
          mkdir -p "$SCREENSHOTS"
          uv run --no-sync pytest -q -s -rs tests/test_app_bundle.py | tee "$RUNNER_TEMP/bundle.log"
          ! grep -q SKIPPED "$RUNNER_TEMP/bundle.log"  # every check of the .dmg ran
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: ${{ runner.temp }}/screens
          retention-days: 7
      - name: SHA-256
        run: cd dist && shasum -a 256 *.dmg | tee "$(ls *.dmg).sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Peresmeshnik-macos-arm64
          path: dist/*.dmg*
          retention-days: 14

  release:
    needs: macos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Peresmeshnik-macos-arm64
          path: dist
      - name: Draft release (published by hand)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sum=$(cat dist/*.sha256)
          cat > notes.md <<EOF
          macOS 14+ on Apple Silicon. Ad-hoc signed, not notarized: after the first blocked start use
          System Settings → Privacy & Security → "Open Anyway" (README, "Installation on macOS"). BlackHole 2ch
          is needed for the voice to the call; the models are downloaded by the setup wizard.
          The bundled Piper runner is GPL-3.0: its sources are listed in Contents/Resources/licenses/piper-runner-SOURCE.txt.

          SHA-256: \`$sum\`
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Peresmeshnik ${GITHUB_REF_NAME#v}" --notes-file notes.md

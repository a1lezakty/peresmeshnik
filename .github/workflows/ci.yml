name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: Lint
        if: runner.os == 'Linux'
        run: uv run ruff check .
      - name: PipeWire (sound server for the device tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pipewire pipewire-pulse wireplumber pulseaudio-utils \
            xvfb xdotool stalonetray libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 libxkbcommon-x11-0 \
            libx11-xcb1 libegl1 libgl1 libfontconfig1 libdbus-1-3
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/pw" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR=$RUNNER_TEMP/pw
          mkdir -m 700 -p "$XDG_RUNTIME_DIR"
          (dbus-run-session -- sh -c 'pipewire & sleep 0.5; wireplumber & sleep 0.5; pipewire-pulse & wait' &)
          sleep 3
          pactl info
      - name: X server with a system tray (the app's tray and overlay, the hotkey)
        if: runner.os == 'Linux'
        run: |
          (Xvfb :99 -screen 0 1280x800x24 -nolisten tcp &)
          sleep 1
          (DISPLAY=:99 stalonetray --geometry 4x1+0+0 &)
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          ldd .venv/lib/python3.12/site-packages/PySide6/Qt/plugins/platforms/libqxcb.so | grep 'not found' || true
          DISPLAY=:99 xdotool getwindowfocus || true
      - name: BlackHole 2ch and 16ch (the virtual devices of the macOS sound tests)
        if: runner.os == 'macOS'
        run: |
          brew install --cask blackhole-2ch blackhole-16ch
          if ! system_profiler SPAudioDataType | grep -q 'BlackHole 16ch'; then
            sudo launchctl kickstart -kp system/com.apple.audio.coreaudiod
            sleep 5
          fi
          system_profiler SPAudioDataType | grep -E '^ +BlackHole'
      - name: Swift tap helper (native/macos/tap), as the .app gets it
        if: runner.os == 'macOS' && hashFiles('native/macos/tap/*.swift') != ''
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          swiftc -O -target arm64-apple-macos12 native/macos/tap/*.swift -o "$RUNNER_TEMP/bin/peresmeshnik-tap"
          echo "PERESMESHNIK_TAP=$RUNNER_TEMP/bin/peresmeshnik-tap" >> "$GITHUB_ENV"
      - name: Swift Core Audio helper (native/macos/audio), me -> them on macOS
        if: runner.os == 'macOS' && hashFiles('native/macos/audio/main.swift') != ''
        run: native/macos/audio/build.sh  # found in its build/ by audio/macos.py; tests fail without it on CI
      # "System Audio Recording" for the call-sound tests (tests/test_macos_audio.py), on the runner's VM only: a TCC.db row
      # for the job's top process (TCC asks the responsible process); refused here, allowed for the rest of the job
      - name: macOS call sound, System Audio Recording refused
        if: runner.os == 'macOS'
        env:  # a missing BlackHole, tap helper or TCC answer fails the test instead of skipping it
          PERESMESHNIK_REQUIRE_MACOS: '1'
        run: |
          sudo sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, flags, last_modified) VALUES ('kTCCServiceAudioCapture', '/opt/hca/hosted-compute-agent', 1, 0, 4, 1, 0, strftime('%s','now'))"
          killall tccd; sleep 1
          PERESMESHNIK_TCC=denied uv run pytest -q -s -rs tests/test_macos_audio.py -k 'check or permission'
      - name: System Audio Recording allowed (the tap tests in the run below)
        if: runner.os == 'macOS'
        run: |
          sudo sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, flags, last_modified) VALUES ('kTCCServiceAudioCapture', '/opt/hca/hosted-compute-agent', 1, 2, 4, 1, 0, strftime('%s','now'))"
          killall tccd; sleep 1
          echo "PERESMESHNIK_TCC=granted" >> "$GITHUB_ENV"
      # SHARED with S2: VB-Cable is the virtual speakers/headphones here and the call app's microphone for me -> them
      - name: VB-Audio Virtual Cable (the virtual speakers/headphones of the Windows sound tests), silent
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 6
        run: |
          Set-Service Audiosrv -StartupType Automatic; Start-Service Audiosrv
          $d = "$env:RUNNER_TEMP\vbcable"
          Invoke-WebRequest https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack46.zip -OutFile "$d.zip"
          if ((Get-FileHash "$d.zip" -Algorithm SHA256).Hash -ne 'BC44E8974191A5A2427D6C979E2DAB08DBB09925F3F435DFA2F0BA3E45B6EB90') { throw 'VB-Cable checksum mismatch' }
          Expand-Archive "$d.zip" $d
          # trust the driver publisher so the install needs no "Install this device software?" dialog (CI only)
          $cert = (Get-AuthenticodeSignature "$d\vbaudio_cable64_win10.cat").SignerCertificate
          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store 'TrustedPublisher', 'LocalMachine'
          $store.Open('ReadWrite'); $store.Add($cert); $store.Close()
          Start-Process "$d\VBCABLE_Setup_x64.exe" -ArgumentList '-i', '-h' -Wait
          Start-Sleep 6
          if (-not (Get-PnpDevice -Class AudioEndpoint | Where-Object FriendlyName -Like '*CABLE Output*')) { throw 'VB-Cable did not install' }
      - name: Loopback helper (native/windows/loopback), as the .exe gets it
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call native\windows\loopback\build.cmd "%RUNNER_TEMP%\bin\peresmeshnik-loopback.exe" || exit /b 1
          echo PERESMESHNIK_LOOPBACK=%RUNNER_TEMP%\bin\peresmeshnik-loopback.exe>> %GITHUB_ENV%
      # includes the idle-CPU watchdogs: the app (tray, overlay, first-run wizard) 60 s idle, and again with
      # the overlay on screen; each fails above 0.13 s of CPU. Linux: Xvfb; macOS, Windows: the runner's desktop
      - run: uv run pytest -q -s -rs  # -rs: what was skipped and why
        env:  # macOS, Windows: a synthetic key press or click that does not arrive fails the test instead of skipping it
          PERESMESHNIK_REQUIRE_SYNTHETIC: ${{ runner.os != 'Linux' && '1' || '' }}
          PERESMESHNIK_REQUIRE_MACOS: ${{ runner.os == 'macOS' && '1' || '' }}  # the call-sound tests run, not skip
          PERESMESHNIK_REQUIRE_WINDOWS: ${{ runner.os == 'Windows' && '1' || '' }}  # the Windows call-sound tests run, not skip

  # working-mode CPU gate: the local pipeline on a 30 s recording (RTF, CPU s per audio s)
  work-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/models
          key: models-${{ runner.os }}-${{ hashFiles('peresmeshnik/models.toml') }}
      - run: uv sync --locked --group dev
      - name: Models (registry, SHA-256 checked)
        env:
          PERESMESHNIK_MODELS: ${{ runner.temp }}/models
        run: uv run peresmeshnik models fetch silero-vad parakeet-tdt-0.6b-v3 opus-mt-en-ru piper-ru_RU-dmitri-medium
      - name: Working-mode CPU gate
        env:
          PERESMESHNIK_WORK_GATE: '1'
          PERESMESHNIK_MODELS: ${{ runner.temp }}/models
        run: uv run pytest -q -s tests/test_pipeline_cpu.py
      - name: A helper that dies (the Piper runner killed while translating) restarts its side, with a clean report
        env:
          PERESMESHNIK_WORK_GATE: '1'  # the models are there: the test fails instead of skipping
          PERESMESHNIK_MODELS: ${{ runner.temp }}/models
        run: uv run pytest -q -s -rs tests/test_crash.py -k killed
      - name: macOS call sound with the models (file -> BlackHole 16ch / a tapped afplay -> subtitles and voice)
        if: runner.os == 'macOS'
        env:
          PERESMESHNIK_WORK_GATE: '1'
          PERESMESHNIK_MODELS: ${{ runner.temp }}/models
          PERESMESHNIK_TCC: granted
          PERESMESHNIK_REQUIRE_MACOS: '1'
        run: |
          brew install --cask blackhole-2ch blackhole-16ch
          if ! system_profiler SPAudioDataType | grep -q 'BlackHole 16ch'; then
            sudo launchctl kickstart -kp system/com.apple.audio.coreaudiod
            sleep 5
          fi
          mkdir -p "$RUNNER_TEMP/bin"
          swiftc -O -target arm64-apple-macos12 native/macos/tap/*.swift -o "$RUNNER_TEMP/bin/peresmeshnik-tap"
          export PERESMESHNIK_TAP=$RUNNER_TEMP/bin/peresmeshnik-tap
          sudo sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, flags, last_modified) VALUES ('kTCCServiceAudioCapture', '/opt/hca/hosted-compute-agent', 1, 2, 4, 1, 0, strftime('%s','now'))"
          killall tccd; sleep 1
          uv run pytest -q -s -rs tests/test_macos_audio.py -k path_gives

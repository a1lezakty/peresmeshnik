name: bench

# research-1116 R3, this branch only: STT candidates on the macOS runner (M1, 3 cores, CPU).
# Manual only: gh workflow run bench.yml --ref research-1116-r3
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r3-stt:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          version: '0.13.7'  # uv itself pinned, not the latest; setup-uv v6.8.0 knows no checksum past 0.8.20, so ours:
          # the SHA-256 of the release's uv-<target> archive (its .sha256 file) for Windows and Linux x64, macOS arm64 and
          # x64; another runner gets a sum that fails
          checksum: ${{ runner.os == 'Windows' && '0cdc5b38fe5a8168ed6a25814f5ba43c21d313dd3187314fccb37b7cec46e021'
            || runner.os == 'Linux' && 'c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83'
            || runner.arch == 'ARM64' && '81b811b57e4624df7ed3aac148e0359100d9962f3d9dce00aec533dc2e086731'
            || '20c47e4c1f630b8abaff8c291fa9b9aa300fef92c4fbff95adf198b55287cda7' }}
          python-version: '3.12'
      - name: Machine
        run: |
          uname -a; sysctl -n machdep.cpu.brand_string hw.memsize hw.ncpu; df -h .
      - name: Venv, clips, models
        working-directory: bench/r3
        run: |
          uv venv -p 3.12 .v
          uv pip install -p .v "onnx-asr[cpu,hub]==0.12.0" sherpa-onnx==2.0.1 soundfile soxr jiwer num2words
          .v/bin/python mac_fetch.py
      - name: Run
        working-directory: bench/r3
        run: |
          for k in gigaam-v3-e2e-ctc parakeet-tdt-0.6b-v3 gigaam-ml-large-ctc gigaam-v3-e2e-rnnt t-one vosk-ru nemotron-unified-0.6b nemotron-stream-0.6b; do
            .v/bin/python bench.py $k --threads 3 --lat --conds clean || echo "FAIL $k"
          done
          .v/bin/python score.py > results/summary.md || true
          cat results/summary.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: r3-stt-macos-15
          path: bench/r3/results/
          if-no-files-found: warn

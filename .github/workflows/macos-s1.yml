# Temporary (stage 3, S1): the macOS call sound on macos-15 while it is being built. Goes away before the PR;
# its final steps move into ci.yml (S3).
name: macos-s1

on:
  push:
    branches: [stage-3-s1]
    paths: ['native/macos/**', 'peresmeshnik/audio/**', 'peresmeshnik/app.py', 'peresmeshnik/pipeline.py', 'tests/test_macos*.py',
            'tests/macos/**', '.github/workflows/macos-s1.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  PERESMESHNIK_REQUIRE_MACOS: '1'  # a missing BlackHole / helper / TCC answer fails, not skips

concurrency:
  group: macos-s1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call-sound:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Build the tap helper
        run: |
          mkdir -p native/macos/tap/build
          swiftc -O -target arm64-apple-macos12 native/macos/tap/*.swift -o native/macos/tap/build/peresmeshnik-tap
          echo "PERESMESHNIK_TAP=$PWD/native/macos/tap/build/peresmeshnik-tap" >> "$GITHUB_ENV"
      - name: BlackHole 2ch / 16ch
        run: |
          brew install --cask blackhole-2ch blackhole-16ch
          if ! system_profiler SPAudioDataType | grep -q 'BlackHole 16ch'; then sudo killall coreaudiod; sleep 3; fi
          system_profiler SPAudioDataType | grep -E '^ {8}[A-Z]|Default' || true
      - run: uv sync --locked --group dev
      # "System Audio Recording" on the runner's VM: TCC asks the process at the top of the job's chain
      - name: Tests, System Audio Recording denied
        run: |
          sudo sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, flags, last_modified) VALUES ('kTCCServiceAudioCapture', '/opt/hca/hosted-compute-agent', 1, 0, 4, 1, 0, strftime('%s','now'))"
          killall tccd; sleep 1
          PERESMESHNIK_TCC=denied uv run pytest -q -s -rs tests/test_macos_audio.py -k 'check or permission'
      - name: Tests, System Audio Recording allowed
        if: success() || failure()
        run: |
          sudo sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, flags, last_modified) VALUES ('kTCCServiceAudioCapture', '/opt/hca/hosted-compute-agent', 1, 2, 4, 1, 0, strftime('%s','now'))"
          killall tccd; sleep 1
          PERESMESHNIK_TCC=granted uv run pytest -q -s -rs tests/test_macos_audio.py
      # m6: which process plays a web page's audio (Safari, a WKWebView): the bundle id the tap would need
      - name: Diagnostic, WebKit audio processes
        if: success() || failure()
        continue-on-error: true
        timeout-minutes: 4
        run: |
          mkdir -p "$RUNNER_TEMP/web"; cd "$RUNNER_TEMP/web"
          uv run --project "$GITHUB_WORKSPACE" python -c "import numpy as n, soundfile as f; f.write('tone.wav', (0.3*n.sin(2*n.pi*440*n.arange(48000*30)/48000)).astype('float32'), 48000)"
          echo '<html><body><audio id="a" autoplay loop src="tone.wav"></audio></body></html>' > page.html
          cat > web.swift <<'SWIFT'
          import AppKit
          import WebKit
          let app = NSApplication.shared
          app.setActivationPolicy(.accessory)
          let config = WKWebViewConfiguration()
          config.mediaTypesRequiringUserActionForPlayback = []
          let window = NSWindow(contentRect: NSRect(x: 0, y: 0, width: 200, height: 100), styleMask: [.titled], backing: .buffered, defer: false)
          let view = WKWebView(frame: window.contentView!.bounds, configuration: config)
          window.contentView!.addSubview(view)
          window.orderFront(nil)
          let url = URL(fileURLWithPath: CommandLine.arguments[1])
          view.loadFileURL(url, allowingReadAccessTo: url.deletingLastPathComponent())
          DispatchQueue.main.asyncAfter(deadline: .now() + 15) { exit(0) }
          app.run()
          SWIFT
          swiftc -O web.swift -o web
          ./web "$PWD/page.html" & sleep 8
          echo "== a WKWebView"; "$PERESMESHNIK_TAP" list; wait
          defaults write com.apple.Safari WebKitMediaPlaybackAllowsInline -bool true || true
          open -a Safari "$PWD/page.html"; sleep 12
          echo "== Safari"; "$PERESMESHNIK_TAP" list
          osascript -e 'tell application "Safari" to quit' || true
      - name: Idle CPU gate (the app's startup asks the helper once)
        if: success() || failure()
        run: uv run pytest -q -s tests/test_idle_cpu.py

  # the local them -> me pipeline through the macOS devices: BlackHole 16ch (macOS < 14.4) and the process tap
  work:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/models
          key: models-${{ runner.os }}-${{ hashFiles('peresmeshnik/models.toml') }}
      - name: Build the tap helper
        run: |
          mkdir -p native/macos/tap/build
          swiftc -O -target arm64-apple-macos12 native/macos/tap/*.swift -o native/macos/tap/build/peresmeshnik-tap
          echo "PERESMESHNIK_TAP=$PWD/native/macos/tap/build/peresmeshnik-tap" >> "$GITHUB_ENV"
      - name: BlackHole 2ch / 16ch
        run: |
          brew install --cask blackhole-2ch blackhole-16ch
          if ! system_profiler SPAudioDataType | grep -q 'BlackHole 16ch'; then sudo killall coreaudiod; sleep 3; fi
      - run: uv sync --locked --group dev
      - name: Models
        env:
          PERESMESHNIK_MODELS: ${{ runner.temp }}/models
        run: uv run peresmeshnik models fetch silero-vad parakeet-tdt-0.6b-v3 opus-mt-en-ru piper-ru_RU-dmitri-medium
      - name: File -> BlackHole 16ch / a tapped afplay -> subtitles and voice on BlackHole 2ch
        env:
          PERESMESHNIK_MODELS: ${{ runner.temp }}/models
          PERESMESHNIK_WORK_GATE: '1'
          PERESMESHNIK_TCC: granted
        run: |
          sudo sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, flags, last_modified) VALUES ('kTCCServiceAudioCapture', '/opt/hca/hosted-compute-agent', 1, 2, 4, 1, 0, strftime('%s','now'))"
          killall tccd; sleep 1
          uv run pytest -q -s -rs tests/test_macos_audio.py -k 'path_gives'

name: voice-pack

# Manual only (Actions → voice-pack → Run workflow; the file has to be on the default branch, or run it with
# `gh workflow run voice-pack.yml --ref <branch>` once it is there): the real Windows voice pack
# (voice-runner/pack-windows.json, ~3.7 GB of downloads, ~8 GB installed) installed by local/voicepack.py as the wizard
# does, into this runner's fresh data folder. No GPU here: torch sees no CUDA, which is expected. Then the clone with the
# real XTTS-v2 on that pack's Python (CPU): every language's text tools and a de -> ja pair (tests/test_clone_langs.py).
# The job linux: the same test in the Linux clone's venv (voice-runner/requirements-linux.txt: CPU torch, every
# package pinned with its hashes, and the setuptools that builds the sdists docopt and unidic-lite too). The model
# (1.9 GB) is cached.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          version: '0.13.7'  # uv itself pinned, not the latest; setup-uv v6.8.0 knows no checksum past 0.8.20, so ours:
          # the SHA-256 of the release's uv-<target> archive (its .sha256 file) for Windows and Linux x64, macOS arm64 and
          # x64; another runner gets a sum that fails
          checksum: ${{ runner.os == 'Windows' && '0cdc5b38fe5a8168ed6a25814f5ba43c21d313dd3187314fccb37b7cec46e021'
            || runner.os == 'Linux' && 'c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83'
            || runner.arch == 'ARM64' && '81b811b57e4624df7ed3aac148e0359100d9962f3d9dce00aec533dc2e086731'
            || '20c47e4c1f630b8abaff8c291fa9b9aa300fef92c4fbff95adf198b55287cda7' }}
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ runner.temp }}/models
          key: xtts-v2-${{ hashFiles('peresmeshnik/models.toml') }}
          restore-keys: xtts-v2-
      - name: XTTS-v2 (from the registry, verified)
        env:
          PERESMESHNIK_MODELS: ${{ runner.temp }}/models
        run: uv run python -m peresmeshnik models fetch xtts-v2 --accept-licenses
      - name: The clone's venv (voice-runner/requirements-linux.txt, CPU torch, hashes required)
        run: |
          uv venv -q -p 3.12 "$RUNNER_TEMP/clone"
          uv pip install -q -p "$RUNNER_TEMP/clone/bin/python" --index-strategy unsafe-best-match \
            --require-hashes -r voice-runner/requirements-linux.txt --build-constraints voice-runner/requirements-linux.txt
      - name: The clone in the new languages (text tools of each, a de -> ja pair through the runner)
        env:
          PERESMESHNIK_CLONE_MODEL: ${{ runner.temp }}/models/xtts-v2
          PERESMESHNIK_REQUIRE_CLONE: '1'
        run: |
          PERESMESHNIK_CLONE_PY="$RUNNER_TEMP/clone/bin/python" \
            uv run --with num2words==0.5.14 pytest -q -s -rA tests/test_clone_langs.py tests/test_clone.py

  install:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          version: '0.13.7'  # uv itself pinned, not the latest; setup-uv v6.8.0 knows no checksum past 0.8.20, so ours:
          # the SHA-256 of the release's uv-<target> archive (its .sha256 file) for Windows and Linux x64, macOS arm64 and
          # x64; another runner gets a sum that fails
          checksum: ${{ runner.os == 'Windows' && '0cdc5b38fe5a8168ed6a25814f5ba43c21d313dd3187314fccb37b7cec46e021'
            || runner.os == 'Linux' && 'c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83'
            || runner.arch == 'ARM64' && '81b811b57e4624df7ed3aac148e0359100d9962f3d9dce00aec533dc2e086731'
            || '20c47e4c1f630b8abaff8c291fa9b9aa300fef92c4fbff95adf198b55287cda7' }}
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - name: Install the real voice pack, then its Python imports torch and TTS
        shell: bash
        env:
          PYTHONIOENCODING: utf-8  # pip's lines and paths in the log as they are
        run: |
          uv run python - <<'EOF'
          import json, shutil, subprocess, sys, time
          from pathlib import Path

          from peresmeshnik.local import voicepack
          from peresmeshnik.local.clone import RUNNER, CloneUnavailable, VoicePackClone

          GB = 2 ** 30
          where, spec = voicepack.folder(), json.loads(voicepack.lock_file().read_text())
          dl = where.with_name('voice-pack.download')
          assert voicepack.state() == 'none', f'{where}: not a fresh data folder ({voicepack.state()})'
          where.parent.mkdir(parents=True, exist_ok=True)
          print(f'pack: {where}; free {shutil.disk_usage(where.parent).free / GB:.1f} GB, '
                f'needs {voicepack.need_bytes() / GB:.1f} GB', flush=True)

          def size(p: Path) -> int:
              return sum(f.stat().st_size for f in p.rglob('*') if f.is_file())

          t0, at, pct, downloaded = time.perf_counter(), {}, [-1], [0]

          def progress(stage, done, total, text=''):
              now = time.perf_counter()
              if stage not in at:
                  if at:
                      last = list(at)[-1]
                      print(f'== {last}: {now - at[last]:.0f} s', flush=True)
                  if stage == 'unpacking':
                      downloaded[0] = size(dl)
                  at[stage] = now
                  print(f'== {stage}', flush=True)
              if stage == 'downloading' and total and done * 10 // total > pct[0]:
                  pct[0] = done * 10 // total
                  print(f'   {done / GB:.2f} of {total / GB:.2f} GB ({now - at[stage]:.0f} s) {text}', flush=True)
              elif stage == 'installing' and text:
                  print('   pip:', text, flush=True)

          voicepack.install(progress)
          end = time.perf_counter()
          last = list(at)[-1]
          print(f'== {last}: {end - at[last]:.0f} s; all: {end - t0:.0f} s')
          files = [spec['python'], spec['pip'], *spec['wheels'], *spec.get('archives', [])]
          print(f'downloaded: {downloaded[0] / GB:.2f} GB (the lock: {sum(f["size"] for f in files) / GB:.2f} GB)')
          print(f'installed: {size(where) / GB:.2f} GB (the lock: {spec["installed_bytes"] / GB:.2f} GB)')
          longest = max((str(p) for p in where.rglob('*')), key=len)
          rel = len(longest) - len(str(where))
          print(f'longest path: {len(longest)} chars, {rel} after the pack folder ({len(str(where))} chars): {longest}')
          if len(longest) >= 260:
              print(f'::warning::a path inside the voice pack is {len(longest)} chars (MAX_PATH 260): {longest}')

          py = str(voicepack.python())
          subprocess.run([py, '-c', 'import torch; print(torch.__version__, torch.version.cuda, torch._C._cuda_getArchFlags())'],
                         check=True)
          subprocess.run([py, '-c', 'import importlib.metadata as m, torch, TTS; '
                          'print("cuda available:", torch.cuda.is_available(), "| coqui-tts", m.version("coqui-tts"))'],
                         check=True)
          try:  # the runner on it with the real model code (local/xtts.py): no model here, so it fails past the imports
              VoicePackClone(where.parent / 'no-model', cmd=[py, str(RUNNER), '--device', 'cpu']).close()
              sys.exit('the runner started without a model')
          except CloneUnavailable as e:
              print('runner without a model:', e)
              assert 'No module named' not in str(e), e
          st = voicepack.state()
          print('state:', st)
          assert st == 'ready', st
          EOF
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ runner.temp }}/models
          key: xtts-v2-${{ hashFiles('peresmeshnik/models.toml') }}
          restore-keys: xtts-v2-
      - name: XTTS-v2 (from the registry, verified)
        env:
          PERESMESHNIK_MODELS: ${{ runner.temp }}/models
        run: uv run python -m peresmeshnik models fetch xtts-v2 --accept-licenses
      - name: The clone in the new languages on the installed pack (CPU)
        shell: bash
        env:
          PERESMESHNIK_CLONE_MODEL: ${{ runner.temp }}/models/xtts-v2
          PERESMESHNIK_REQUIRE_CLONE: '1'
          PYTHONIOENCODING: utf-8
        run: |
          PERESMESHNIK_CLONE_PY="$(uv run python -c 'from peresmeshnik.local import voicepack; print(voicepack.python())')" \
            uv run --with num2words==0.5.14 pytest -q -s -rA tests/test_clone_langs.py

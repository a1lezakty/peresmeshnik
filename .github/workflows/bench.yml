name: bench

# research-1116-r4 only (round 8), manual: dispatched with ref research-1116-r4.
# Exports the ZONOS3-Mini "toward Russian speakers" direction of round 5 (40 FLEURS test clips per language, speakers
# apart from the dev voices) as base64 in the log, so other streams can use the same 192 numbers.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direction:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BENCH_DATA: ${{ github.workspace }}/bench-data
      HF_HOME: ${{ github.workspace }}/hf
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          version: '0.13.7'
          checksum: 'c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83'
          python-version: '3.11'
      - name: Data
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg > /dev/null
          uv venv -q -p 3.11 venv-run && uv pip install -q -p venv-run/bin/python numpy soundfile scipy huggingface_hub pyarrow
          venv-run/bin/python -c "
          import sys; sys.path.insert(0, 'bench')
          from data import fleurs
          print(len(fleurs('en', 'us', split='test')), len(fleurs('ru', 'ru', split='test')))"
      - name: Speaker encoder
        run: |
          git clone -q https://github.com/Zyphra/ZONOS3-Mini z && git -C z checkout -q 96d9e0ec
          git -C z submodule update -q --init --recursive
          cd z/servers/ggml && cmake -B build -DCMAKE_BUILD_TYPE=Release > ../../../build.log 2>&1 && cmake --build build -j4 --target spk-encoder-cli >> ../../../build.log 2>&1 \
            || { tail -40 ../../../build.log; exit 1; }
          cd ../../.. && venv-run/bin/python -c "
          from huggingface_hub import hf_hub_download as h
          h('Zyphra/ZONOS3-Mini', 'gguf/spk-encoder.gguf', local_dir='z/servers/ggml')"
      - name: Direction
        run: |
          export ZONOS_BIN=$PWD/z/servers/ggml/build ZONOS_GGUF=$PWD/z/servers/ggml/gguf
          DIR_CLIPS='fleurs/{lang}/test/*.wav' DIR_MAX=40 venv-run/bin/python r4/zonos_dir.py ru_dir_test.npy
          sha256sum ru_dir_test.npy; echo "B64 $(base64 -w0 ru_dir_test.npy)"

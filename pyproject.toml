[project]
name = "peresmeshnik"
version = "0.0.0"
description = "Real-time call translator: subtitles and translated speech both ways, in your own cloned voice"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Akty" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2",
    "platformdirs>=4",
    "google-genai>=3",
    "onnxruntime>=1.20",
    "onnx-asr[hub]>=0.12",
    "ctranslate2>=4.5",
    "sentencepiece>=0.2",
    "soundfile>=0.13",
    "psutil>=6",
]

[project.scripts]
peresmeshnik = "peresmeshnik.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "psutil>=6", "ruff>=0.8"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B007", "B905"]

[tool.ruff.lint.isort]
known-local-folder = ["common"]  # bench/ scripts import their helper module directly

name: bench

# research-1116-r4 only (round 5: ZONOS3-Mini on 8 FLEURS voices, the Russian direction from FLEURS test speakers), manual: dispatched with ref research-1116-r4.
# zonos-ru: ZONOS3-Mini (commit 96d9e0ec, Russian since 13.11) on the CPU by the BENCH tts_clone method
#   (bench/clone_light.py: 6 shortest FLEURS sentences, ECAPA vs the full reference, faster-whisper small CER).
# stock-ru: speed and Whisper-small CER of the new light stock voices (Kitten TTS 2 mini, Supertonic 3, kokoro-ru).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zonos-ru:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BENCH_DATA: ${{ github.workspace }}/bench-data
      BENCH_OUT: ${{ github.workspace }}/out
      HF_HOME: ${{ github.workspace }}/hf
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      N: '6'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          version: '0.13.7'
          checksum: 'c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83'
          python-version: '3.11'
      - name: Machine
        run: nproc; lscpu | head -20; free -g; df -h .; command -v ffmpeg cargo cmake
      - name: Data and venvs
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg > /dev/null && ffmpeg -version | head -1
          uv run -q --no-project -p 3.11 --with numpy --with soundfile --with pyarrow python bench/data.py
          uv venv -q -p 3.11 venv-eval && uv pip install -q -p venv-eval/bin/python -r bench/requirements-tts-clone-eval.txt
          uv venv -q -p 3.11 venv-run && uv pip install -q -p venv-run/bin/python numpy soundfile scipy huggingface_hub psutil
      - name: Build ZONOS3-Mini ggml server
        run: |
          git clone -q https://github.com/Zyphra/ZONOS3-Mini z && git -C z checkout -q 96d9e0ec
          git -C z submodule update -q --init --recursive
          git -C z submodule status --recursive | head
          cd z/servers/ggml && cmake -B build -DCMAKE_BUILD_TYPE=Release > ../../../build.log 2>&1 && cmake --build build -j4 >> ../../../build.log 2>&1 \
            || { tail -40 ../../../build.log; exit 1; }
          ls build | head -30
      - name: Weights
        run: |
          venv-run/bin/python -c "
          from huggingface_hub import hf_hub_download as h
          for f in ('backbone-ptq.gguf', 'zac-keep2.gguf', 'spk-encoder.gguf'):
              h('Zyphra/ZONOS3-Mini', 'gguf/' + f, local_dir='z/servers/ggml')"
          ls -la z/servers/ggml/gguf
      - name: Voices and the direction
        run: |
          export ZONOS_BIN=$PWD/z/servers/ggml/build ZONOS_GGUF=$PWD/z/servers/ggml/gguf VOICES=$PWD/data-voices
          BENCH_THREADS=4 venv-eval/bin/python r4/voices_pick.py
          uv run -q --no-project -p 3.11 --with numpy --with soundfile --with pyarrow python -c "
          import sys; sys.path.insert(0, 'bench')
          from data import fleurs
          print(len(fleurs('en', 'us', split='test')), len(fleurs('ru', 'ru', split='test')))"
          DIR_CLIPS='fleurs/{lang}/test/*.wav' DIR_MAX=40 venv-run/bin/python r4/zonos_dir.py ru_dir_test.npy
      - name: Run
        run: |
          export ZONOS_BIN=$PWD/z/servers/ggml/build ZONOS_GGUF=$PWD/z/servers/ggml/gguf
          cat data-voices/voices.json
          run() {  # label args...  (the voice is the reference 'en'; en2ru = the voice speaking Russian)
            local L=$1; shift
            echo "== $L"
            if BENCH_THREADS=4 OMP_NUM_THREADS=4 taskset -c 0-3 venv-run/bin/python bench/clone_light.py synth --model zonos --label "$L" --n "$N" "$@" > "$L.log" 2>&1; then
              BENCH_THREADS=4 venv-eval/bin/python bench/clone_light.py eval --label "$L" 2>&1 | grep -E '^\{' || echo "eval failed: $L"
            else
              tail -25 "$L.log"; echo "synth failed: $L"
            fi
          }
          for d in data-voices/v*/; do v=$(basename $d)
            export BENCH_DATA=$PWD/$d BENCH_OUT=$PWD/out-voices/$v
            BENCH_THREADS=4 venv-eval/bin/python bench/clone_light.py refs --secs 5 > /dev/null 2>&1
            unset ZONOS_SHIFT
            run $v-zonos --ref-s 5 --cases en2en,en2ru
            for dose in 0.75 1; do
              export ZONOS_SHIFT=$PWD/ru_dir_test.npy:$dose
              run $v-zonos-d$dose --ref-s 5 --cases en2ru
            done
          done
